<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · NetGuard</title>
  <link rel="icon" href="/static/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/netguard.css">
</head>
<body>
  <div class="ng-app">
    <aside class="ng-sidebar" id="ng-sidebar"></aside>
    <div class="ng-main">
      <header class="ng-topbar" id="ng-topbar"></header>
      <main class="ng-content">
        <div class="ng-page-header">
          <div>
            <h2>Overview</h2>
            <p>Networks, recent activity and validation results.</p>
          </div>
          <div class="d-flex gap-2">
            <a class="btn btn-outline-primary" href="/networks"><i class="bi bi-hdd-network me-1"></i>Manage Networks</a>
            <a class="btn btn-primary" href="/topology"><i class="bi bi-diagram-3 me-1"></i>Open Topology</a>
          </div>
        </div>

        <div class="row g-3 mb-3" id="stat-cards"></div>

        <div class="ng-card mb-3">
          <div class="ng-card-header"><h3>Recent Network Activity</h3><a href="/reports" class="small">View history</a></div>
          <div id="recent-activity"></div>
        </div>

        <div class="ng-card mb-3">
          <div class="ng-card-header"><h3>Recent Assessments</h3><a href="/reports?scope=all" class="small">Reports &amp; history</a></div>
          <div id="recent-assessments"></div>
        </div>

        <div class="row g-3">
          <div class="col-xl-8">
            <div class="ng-card h-100">
              <div class="ng-card-header">
                <h3>Recent Networks</h3>
                <a href="/networks" class="small">View all</a>
              </div>
              <div id="recent-networks"></div>
            </div>
          </div>
          <div class="col-xl-4">
            <div class="ng-card mb-3">
              <div class="ng-card-header"><h3>Device Inventory</h3><span class="small text-muted-ng" id="inventory-total"></span></div>
              <div class="ng-card-body" id="device-inventory"></div>
            </div>
            <div class="ng-card">
              <div class="ng-card-header"><h3>Risk &amp; Validation Summary</h3><a href="/changes" class="small">View changes</a></div>
              <div class="ng-card-body" id="risk-distribution"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="/static/vendor/bootstrap/js/bootstrap.bundle.min.js" defer></script>
  <script type="module" src="/static/js/pages/dashboard.js"></script>
</body>
</html>
